<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Django on OceanLaunch</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7f5; color: #17231d;
               font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
        main { max-width: 34rem; margin: 2rem; padding: 2.5rem; background: #fff; border-radius: 1rem;
               box-shadow: 0 10px 30px rgba(23, 35, 29, .08); }
        h1 { margin: 0 0 .5rem; font-size: 1.6rem; }
        p { margin: 0 0 1rem; color: #46564d; }
        dl { display: grid; grid-template-columns: auto 1fr; gap: .4rem 1rem; margin: 1.5rem 0; }
        dt { font-weight: 600; } dd { margin: 0; color: #46564d; }
        a { color: #0c7a43; }
        code { background: #eef3f0; padding: .1rem .35rem; border-radius: .3rem; }
    </style>
</head>
<body>
<main>
    <h1>Your Django site is live</h1>
    <p>Deployed on OceanLaunch from Git. Edit <code>core/views.py</code> and <code>core/templates/core/home.html</code>,
        push, and it deploys again.</p>
    <dl>
        <dt>Visits</dt><dd>{{ visits }} (kept in the database)</dd>
        <dt>Django</dt><dd>{{ django }}</dd>
        <dt>Python</dt><dd>{{ python }}</dd>
        <dt>Database</dt><dd>{{ database }}</dd>
    </dl>
    <p><a href="https://docs.djangoproject.com/">Django docs</a> · <a href="https://oceanlaunch.cloud/docs/templates">OceanLaunch templates</a></p>
</main>
</body>
</html>
